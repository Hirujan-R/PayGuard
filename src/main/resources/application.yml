server:
  port: 8080

spring:
  application:
    name: payguard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payguard}
    username: ${DB_USER:payguard}
    password: ${DB_PASSWORD:payguard}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

payguard:
  scheduling:
    enabled: true
  resilience:
    circuit-breaker:
      sliding-window-size: 10
      failure-rate-threshold: 40
      wait-duration-in-open-state-ms: 10000
      permitted-number-of-calls-in-half-open-state: 3
    retry:
      max-attempts: 3
      initial-backoff-ms: 200
      backoff-multiplier: 2.0
  fraud:
    threshold: 0.7
    velocity-window-minutes: 10
    velocity-min-attempts: 3
    velocity-high-attempts: 8
    amount-min-history: 3
    amount-zscale: 5.0
    geo-jump-window-minutes: 90
  reconcile:
    interval-ms: 5000
    unknown-grace-ms: 8000
    pending-grace-ms: 60000
  bank:
    default-mode: NORMAL

logging:
  level:
    com.payguard: INFO
